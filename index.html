<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint — preconstruction tools</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========================= AUTH / RECOVER ========================= -->
<div id="auth">
  <div class="auth-card">
    <div class="brand">
      <img src="logo.svg" alt="Blueprint">
      <h1>Blueprint <span id="demoPill" class="demo-pill hidden">LOCAL</span></h1>
    </div>
    <p class="auth-sub" id="authSub">Sign in with your work email and password to reach your preconstruction tools.</p>

    <!-- normal sign-in -->
    <div id="stepSignin">
      <label class="fld" for="email">Work email</label>
      <input type="email" id="email" placeholder="you@lennar.com" autocomplete="email">
      <label class="fld" for="password" style="margin-top:12px">Password</label>
      <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      <button class="btn" id="signinBtn">Sign in</button>
    </div>

    <!-- password-set, reached from a credential link (#recover=…) -->
    <div id="stepRecover" class="hidden">
      <label class="fld" for="newPass">Choose a password</label>
      <input type="password" id="newPass" placeholder="At least 8 characters" autocomplete="new-password">
      <label class="fld" for="newPass2" style="margin-top:12px">Confirm password</label>
      <input type="password" id="newPass2" placeholder="Re-enter password" autocomplete="new-password">
      <button class="btn" id="setPassBtn">Set password</button>
    </div>

    <div id="authMsg" class="msg"></div>
    <p class="tiny">Access limited to approved accounts. One sign-in covers every tool on this hub.</p>
  </div>
</div>

<!-- ============================== APP ============================== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-in">
      <button class="home-logo" id="homeLogo" title="Home"><img src="logo.svg" alt="Blueprint — home"></button>
      <span class="title">Blueprint</span>
      <input type="text" id="globalSearch" placeholder="Search apps, people…">
      <div class="spacer"></div>
      <div class="topbar-actions">
        <span class="user-chip" id="userChip"></span>
        <button class="linkbtn" id="themeBtn">Dark</button>
        <button class="linkbtn" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>

  <footer class="site-foot">
    <span>Blueprint</span>
    <span class="sep">&middot;</span>
    <a id="feedbackLink" href="#">Send feedback</a>
  </footer>
</div>

<div id="toast"></div>

<!-- supabase-js is pinned to an exact release rather than floating on @2. The
     bare @2 specifier resolved to whichever v2 was newest at page load, so two
     visitors an hour apart could run different code than anything anyone tested,
     and a bad — or tampered-with — publish would land in production with no step
     in between. The integrity hash makes that guarantee real: the browser refuses
     the file outright unless its bytes are the ones verified here, so the CDN is
     no longer trusted to serve what it promised.

     The path is dist/umd/supabase.js, not …min.js: the package ships only the
     former, already minified, and jsDelivr fabricates the .min.js name on demand
     by prepending its own banner. Hashing that would put a CDN-generated artifact
     behind the integrity check instead of a published file. Upgrading within 2.x
     means changing the version and the hash together — one without the other
     blocks the script and takes the whole app down with it. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"
        integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg"
        crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="core.js"></script>

<!-- Data Intake. ingest-core.js is pure logic and is also loaded inside the
     parsing worker, which is why it is a plain script rather than part of app.js.

     SheetJS is vendored at 0.20.3 under vendor/, not loaded from a CDN. The 0.18.5
     build this used to pull carries CVE-2023-30533 (prototype pollution from a
     crafted workbook, fixed in 0.19.3) and CVE-2024-22363 (ReDoS, fixed in 0.20.2),
     and intake's whole job is opening files that arrive from elsewhere. 0.20.3 is
     published only from cdn.sheetjs.com, which is also why it is copied in rather
     than linked: the worker imports it through importScripts, where no integrity
     attribute is possible, so a remote copy would be unverifiable on every parse.

     Vendor Assignments and Takeoff Flow still load 0.18.5, so parse parity with
     them is no longer guaranteed by the two sides running identical code. The
     ingest tests are what hold that contract now: they parse the real workbooks and
     assert intake's output matches what those apps produce. If the apps and intake
     ever disagree about a file, that is where it will show up. The main thread needs
     SheetJS for nothing itself; the worker imports it separately. -->
<script src="ingest-core.js"></script>
<!-- Shared verbatim with the Community Map repo, which builds the same document
     from its CLI. A drift test fails if the two copies stop matching. -->
<script src="map-core.js"></script>
<!-- Also shared verbatim. Only its address lookup is reachable from a browser:
     street lookups need a User-Agent, which a browser cannot set, so it refuses
     them here and the map's CLI does that work. Used when somebody types an
     address for a community that has no coordinate yet. -->
<script src="geo-client.js"></script>

<!-- The in-memory mock is a development dependency and is not deployed: dev/ is
     excluded from the published site. Load it only when serving from localhost
     without ?live=1, so production never requests a file that isn't there.
     document.write is used deliberately — it keeps the load synchronous, which
     db.js requires, with no bundler or module loader involved. -->
<script>
(function () {
  var local = /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(location.hostname);
  var forcedLive = /[?&]live=1\b/.test(location.search);
  if (local && !forcedLive) {
    document.write('<script src="dev/mock-db.js"><\/script>');
  }
})();
</script>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
